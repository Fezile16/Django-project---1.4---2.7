{% extends 'base.html' %}

{% block title %}Delete {{ book.title }} - {{ SITE_NAME }}{% endblock %}

{% block content %}
<h1>Delete book</h1>
<div class="card">
    <p>Are you sure you want to delete <strong>{{ book.title }}</strong> by {{ book.author }}?</p>
    <p class="muted">This cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="danger">Yes, delete</button>
        <a href="{% url 'library:detail' book.pk %}">Cancel</a>
    </form>
</div>
{% endblock %}
